services:
  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      # CRITICAL: Persist certificates to avoid Let's Encrypt rate limits
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - gooddeeds_net
