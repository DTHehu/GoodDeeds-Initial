server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        # React Router handles routing in the browser - a path like
        # /vol-dashboard isn't a real file on disk. For every request, try in
        # order:
        #   1. $uri        - an exact file match (e.g. /assets/index.js)
        #   2. $uri/       - a directory match
        #   3. /index.html - neither exists, so serve the app itself instead
        #                    of a 404. Its JS then reads the URL and renders
        #                    the right page.
        try_files $uri $uri/ /index.html;
    }
}
